<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trivia</title>
	<link rel="stylesheet" href="css/trivia.css">
	<script src="js/trivia.js" defer></script>
</head>

<body>
	<main>
		<!-- Left side -->
		<div class="content">
			<p id="date"></p>
			<h2 id="greeting"></h2>

			<h2>User Information</h2>
			<p id="username"></p>
			<p id="domain"></p>

			<h2>Quote of the Day</h2>
			<p id="quote"></p>
		</div>

		<!-- Right side -->
		<aside class="results">
			<h2>Quiz Results</h2>
			<table>
				<thead>
					<tr>
						<th>Question</th>
						<th>Points</th>
					</tr>
				</thead>
				<tbody id="results-body"></tbody>
				<tfoot>
					<tr>
						<td>Score</td>
						<td id="result"></td>
					</tr>
					<tr>
						<td>Percentage</td>
						<td id="percentage"></td>
					</tr>
				</tfoot>
			</table>
		</aside>
	</main>

</body>
</html>
